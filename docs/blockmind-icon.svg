<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- 背景：浅色圆角矩形 -->
  <rect width="512" height="512" rx="96" fill="#f8fafc"/>

  <!-- 等距立方体 -->
  <!-- 顶面 -->
  <polygon points="256,120 372,180 256,240 140,180" fill="url(#topFace)" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 左面 -->
  <polygon points="140,180 256,240 256,376 140,316" fill="url(#leftFace)" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 右面 -->
  <polygon points="372,180 256,240 256,376 372,316" fill="url(#rightFace)" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 顶面：B 字母（BlockMind） -->
  <text x="256" y="195" font-family="Georgia, serif" font-size="56" font-weight="700"
        fill="#6366f1" text-anchor="middle" dominant-baseline="middle">B</text>

  <!-- 左面：横线（代表记忆层） -->
  <g stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="165" y1="225" x2="225" y2="255"/>
    <line x1="165" y1="255" x2="225" y2="285"/>
    <line x1="165" y1="285" x2="225" y2="315"/>
  </g>

  <!-- 右面：节点连接（代表 AI） -->
  <g fill="#6366f1">
    <circle cx="310" cy="250" r="5"/>
    <circle cx="345" cy="290" r="5"/>
    <circle cx="310" cy="330" r="5"/>
  </g>
  <g stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="310" y1="250" x2="345" y2="290"/>
    <line x1="345" y1="290" x2="310" y2="330"/>
    <line x1="310" y1="250" x2="310" y2="330"/>
  </g>
</svg>
