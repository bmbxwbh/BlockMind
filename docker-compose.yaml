services:
  blockmind:
    image: ghcr.io/bmbxwbh/blockmind:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockmind
    restart: unless-stopped
    ports:
      - "${BLOCKMIND_PORT:-19951}:19951"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - blockmind-data:/data
      - ./skills:/app/skills
    environment:
      - PYTHONPATH=/app
      - BLOCKMIND_CONFIG=/app/config.yaml
      - BLOCKMIND_PORT=19951
      - BLOCKMIND_PASSWORD=${BLOCKMIND_PASSWORD:-}
      - BLOCKMIND_API_TOKEN=${BLOCKMIND_API_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:19951/api/system/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  blockmind-data:
