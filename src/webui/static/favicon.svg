<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- 背景：浅色圆角矩形 -->
  <rect width="512" height="512" rx="96" fill="#f8fafc"/>

  <!-- 等距立方体（放大 1.3x） -->
  <!-- 顶面 -->
  <polygon points="256,82 407,160 256,238 105,160" fill="url(#topFace)" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
  <!-- 左面 -->
  <polygon points="105,160 256,238 256,414 105,336" fill="url(#leftFace)" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
  <!-- 右面 -->
  <polygon points="407,160 256,238 256,414 407,336" fill="url(#rightFace)" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>

  <!-- 顶面：中心圆点（代表核心） -->
  <circle cx="256" cy="160" r="10" fill="#6366f1"/>
  <circle cx="256" cy="160" r="18" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- 左面：横线（代表记忆层） -->
  <g stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="138" y1="218" x2="216" y2="257"/>
    <line x1="138" y1="257" x2="216" y2="296"/>
    <line x1="138" y1="296" x2="216" y2="335"/>
  </g>

  <!-- 右面：节点连接（代表 AI） -->
  <g fill="#6366f1">
    <circle cx="326" cy="245" r="7"/>
    <circle cx="372" cy="303" r="7"/>
    <circle cx="326" cy="355" r="7"/>
  </g>
  <g stroke="#6366f1" stroke-width="2" stroke-opacity="0.4">
    <line x1="326" y1="245" x2="372" y2="303"/>
    <line x1="372" y1="303" x2="326" y2="355"/>
    <line x1="326" y1="245" x2="326" y2="355"/>
  </g>
</svg>
