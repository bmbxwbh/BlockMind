name: Build & Publish

on:
  push:
    branches: [main, autoci]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOTNET_VERSION: '8.0.x'
  FLUTTER_CHANNEL: stable

# ── 全局取消同分支旧构建 ──
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════
  # 0. Lint（Python + Desktop）
  # ══════════════════════════════════════
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/ --output-format=github

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Desktop restore
        run: dotnet restore
        working-directory: desktop/src/BlockMind.Desktop

      - name: Desktop build check
        run: dotnet build --no-restore --warnaserror
        working-directory: desktop/src/BlockMind.Desktop

  # ══════════════════════════════════════
  # 1. 构建 Fabric Mod（多版本矩阵）
  # ══════════════════════════════════════
  build-mod:
    name: 🔧 Mod ${{ matrix.mc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 1.20.x (Java 17, Gradle 8.8) ──
          - { mc-version: '1.20',    java: '17', gradle: '8.8' }
          - { mc-version: '1.20.1',  java: '17', gradle: '8.8' }
          - { mc-version: '1.20.2',  java: '17', gradle: '8.8' }
          - { mc-version: '1.20.3',  java: '17', gradle: '8.8' }
          - { mc-version: '1.20.4',  java: '17', gradle: '8.8' }
          - { mc-version: '1.20.6',  java: '21', gradle: '8.8' }
          # ── 1.21.x (Java 21, Gradle 8.10) ──
          - { mc-version: '1.21',    java: '21', gradle: '8.10' }
          - { mc-version: '1.21.1',  java: '21', gradle: '8.10' }
          - { mc-version: '1.21.2',  java: '21', gradle: '8.10' }
          - { mc-version: '1.21.3',  java: '21', gradle: '8.10' }
          - { mc-version: '1.21.4',  java: '21', gradle: '8.10' }
          # ── 26.x (Java 25, Gradle 9.5) ──
          - { mc-version: '26.1',    java: '25', gradle: '9.5.0' }
          - { mc-version: '26.1.1',  java: '25', gradle: '9.5.0' }
          - { mc-version: '26.1.2',  java: '25', gradle: '9.5.0' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-version: ${{ matrix.gradle }}

      - name: Print toolchain versions
        working-directory: mod
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Build Mod
        working-directory: mod
        run: |
          EXTRA_ARGS=""
          if [[ "${{ matrix.mc-version }}" == 26.* ]]; then
            EXTRA_ARGS="-Pfabric.loom.disableObfuscation=true"
          fi
          gradle build --no-daemon -PmcVersion=${{ matrix.mc-version }} $EXTRA_ARGS

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: blockmind-mod-${{ matrix.mc-version }}
          path: mod/build/libs/blockmind-mod-*.jar
          retention-days: 30

  # ══════════════════════════════════════
  # 2. Python 测试
  # ══════════════════════════════════════
  test-python:
    name: 🧪 Python Tests
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ══════════════════════════════════════
  # 3. 构建 Desktop 桌面端（多平台矩阵）
  # ══════════════════════════════════════
  build-desktop:
    name: 🖥️ Desktop ${{ matrix.os-name }}
    runs-on: ${{ matrix.runner }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os-name: Windows-x64,  runner: windows-latest, rid: win-x64 }
          - { os-name: Linux-x64,    runner: ubuntu-latest,  rid: linux-x64 }
          - { os-name: macOS-Intel,  runner: macos-13,       rid: osx-x64 }
          - { os-name: macOS-ARM64,  runner: macos-latest,   rid: osx-arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Desktop
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        working-directory: desktop/src/BlockMind.Desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockMind-Desktop-${{ matrix.os-name }}
          path: desktop/src/BlockMind.Desktop/bin/Release/net8.0/${{ matrix.rid }}/publish/BlockMind.Desktop*
          retention-days: 30

  # ══════════════════════════════════════
  # 4. 构建 Mobile 移动端（Android + iOS）
  # ══════════════════════════════════════
  build-mobile-android:
    name: 📱 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get
        working-directory: mobile

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
        working-directory: mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockMind-Mobile-Android-arm64
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-mobile-ios:
    name: 📱 iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get
        working-directory: mobile

      - name: Build iOS
        run: flutter build ios --release --no-codesign
        working-directory: mobile

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r BlockMind-Mobile-iOS-arm64.ipa Payload/
        working-directory: mobile

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlockMind-Mobile-iOS-arm64
          path: mobile/BlockMind-Mobile-iOS-arm64.ipa
          retention-days: 30

  # ══════════════════════════════════════
  # 5. 构建并推送 Docker 镜像
  # ══════════════════════════════════════
  build-docker:
    name: 🐳 Docker Image
    runs-on: ubuntu-latest
    needs: [build-mod, test-python]
    if: always() && needs.test-python.result == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Mod JARs
        uses: actions/download-artifact@v4
        with:
          pattern: blockmind-mod-*
          merge-multiple: true
          path: mod/build/libs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "## 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`latest\` | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════
  # 6. 自动打 Tag（push main 时触发）
  # ══════════════════════════════════════
  auto-tag:
    name: 🏷️ Auto Tag
    runs-on: ubuntu-latest
    needs: [build-mod, test-python, build-desktop, build-mobile-android, build-mobile-ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "false" ]; then
            echo "## 🏷️ Auto Tag Created" >> $GITHUB_STEP_SUMMARY
            echo "Created tag \`v${{ steps.version.outputs.version }}\` — release will start automatically." >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🏷️ Auto Tag Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Tag \`v${{ steps.version.outputs.version }}\` already exists." >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════
  # 7. 发布到 GitHub Releases（tag 触发）
  # ══════════════════════════════════════
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build-mod, build-desktop, build-mobile-android, build-mobile-ios, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Mod JARs
        uses: actions/download-artifact@v4
        with:
          pattern: blockmind-mod-*
          merge-multiple: true
          path: release/

      - name: Download Desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: BlockMind-Desktop-*
          merge-multiple: true
          path: release/desktop/

      - name: Download Mobile builds
        uses: actions/download-artifact@v4
        with:
          pattern: BlockMind-Mobile-*
          merge-multiple: true
          path: release/mobile/

      - name: Organize release files
        run: |
          mkdir -p release/mod release/desktop release/mobile
          # Mod JARs 已在 release/ 根目录，移到 mod/
          find release/ -maxdepth 1 -name "blockmind-mod-*.jar" -exec mv {} release/mod/ \;
          echo "## 📦 Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find release/ -type f | sort >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD~10..HEAD)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/mod/blockmind-mod-*.jar
            release/desktop/BlockMind-Desktop-*
            release/mobile/BlockMind-Mobile-*
          body: |
            ## 🧠 BlockMind ${{ github.ref_name }}

            ### 📦 Mod JARs
            选择与你的 Minecraft 服务器版本匹配的 JAR 放入 `mods/` 目录。

            **MC 1.20.x：**
            | 文件 | 说明 |
            |------|------|
            | `blockmind-mod-1.20.jar` | MC 1.20 |
            | `blockmind-mod-1.20.1.jar` | MC 1.20.1 |
            | `blockmind-mod-1.20.2.jar` | MC 1.20.2 |
            | `blockmind-mod-1.20.3.jar` | MC 1.20.3 |
            | `blockmind-mod-1.20.4.jar` | MC 1.20.4 |
            | `blockmind-mod-1.20.6.jar` | MC 1.20.6 |

            **MC 1.21.x：**
            | 文件 | 说明 |
            |------|------|
            | `blockmind-mod-1.21.jar` | MC 1.21 |
            | `blockmind-mod-1.21.1.jar` | MC 1.21.1 |
            | `blockmind-mod-1.21.2.jar` | MC 1.21.2 |
            | `blockmind-mod-1.21.3.jar` | MC 1.21.3 |
            | `blockmind-mod-1.21.4.jar` | MC 1.21.4 |

            **MC 26.x（最新）：**
            | 文件 | 说明 |
            |------|------|
            | `blockmind-mod-26.1.jar` | MC 26.1 |
            | `blockmind-mod-26.1.1.jar` | MC 26.1.1 |
            | `blockmind-mod-26.1.2.jar` | MC 26.1.2 |

            ### 🖥️ Desktop 桌面端
            | 文件 | 平台 |
            |------|------|
            | `BlockMind-Desktop-Windows-x64` | Windows x64 |
            | `BlockMind-Desktop-Linux-x64` | Linux x64 |
            | `BlockMind-Desktop-macOS-Intel` | macOS Intel |
            | `BlockMind-Desktop-macOS-ARM64` | macOS Apple Silicon |

            ### 📱 Mobile 移动端
            | 文件 | 平台 |
            |------|------|
            | `BlockMind-Mobile-Android-arm64` | Android arm64 |
            | `BlockMind-Mobile-iOS-arm64.ipa` | iOS arm64 |

            ### 🐳 Docker
            ```bash
            docker pull ghcr.io/bmbxwbh/blockmind:latest
            ```

            ### 📝 Changes
            ${{ steps.changelog.outputs.changes }}

            ---
            > 💡 桌面端已包含后端，无需单独安装 Python 环境
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # ══════════════════════════════════════
  # 8. 推送 Python 包到 PyPI（可选）
  # ══════════════════════════════════════
  publish-pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test-python]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
