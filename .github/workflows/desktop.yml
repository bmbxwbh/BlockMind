name: Build Desktop App

on:
  push:
    branches: [feature/desktop-app]
  pull_request:
    branches: [feature/desktop-app]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ──
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
        working-directory: desktop/src/BlockMind.Desktop
      - run: dotnet build --no-restore --warnaserror
        working-directory: desktop/src/BlockMind.Desktop

  # ── Build Windows ──
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        working-directory: desktop/src/BlockMind.Desktop
      - uses: actions/upload-artifact@v4
        with:
          name: blockmind-desktop-win-x64
          path: desktop/src/BlockMind.Desktop/bin/Release/net8.0/win-x64/publish/
          retention-days: 30

  # ── Build macOS (Intel) ──
  build-macos-x64:
    name: macOS Intel
    runs-on: macos-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish -c Release -r osx-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        working-directory: desktop/src/BlockMind.Desktop
      - uses: actions/upload-artifact@v4
        with:
          name: blockmind-desktop-osx-x64
          path: desktop/src/BlockMind.Desktop/bin/Release/net8.0/osx-x64/publish/
          retention-days: 30

  # ── Build macOS (Apple Silicon) ──
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        working-directory: desktop/src/BlockMind.Desktop
      - uses: actions/upload-artifact@v4
        with:
          name: blockmind-desktop-osx-arm64
          path: desktop/src/BlockMind.Desktop/bin/Release/net8.0/osx-arm64/publish/
          retention-days: 30

  # ── Build Linux ──
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        working-directory: desktop/src/BlockMind.Desktop
      - uses: actions/upload-artifact@v4
        with:
          name: blockmind-desktop-linux-x64
          path: desktop/src/BlockMind.Desktop/bin/Release/net8.0/linux-x64/publish/
          retention-days: 30

  # ── Summary ──
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-x64, build-macos-arm64, build-linux]
    if: always()
    steps:
      - run: |
          echo "## Desktop Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS Intel | ${{ needs.build-macos-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS ARM64 | ${{ needs.build-macos-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux x64 | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
