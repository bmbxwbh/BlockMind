name: Validate & Publish Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  validate-skills:
    name: 🔍 Validate Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: List Skill files
        run: |
          echo "=== Skills ==="
          find skills/ -name '*.yaml' | sort
          echo ""
          echo "Total: $(find skills/ -name '*.yaml' | wc -l)"

      - name: Validate Skill structure
        run: |
          python -c "
          import yaml, os, sys, re

          errors = []
          warnings = []

          REQUIRED_FIELDS = ['skill_id', 'name']
          RECOMMENDED_FIELDS = ['tags', 'priority', 'do']
          VALID_ACTIONS = {
              'walk_to', 'dig_block', 'place_block', 'attack', 'eat',
              'look_at', 'chat', 'wait', 'use_item', 'craft_item',
              'equip_item', 'drop_item', 'smart_navigate',
              'scan_blocks', 'scan_entities',
              'loop', 'if',
          }
          DANGEROUS_PATTERNS = [
              r'__import__',
              r'eval\s*\(',
              r'exec\s*\(',
              r'subprocess',
              r'os\.system',
              r'open\s*\(',
          ]

          for dp, _, fn in os.walk('skills'):
              for f in fn:
                  if not f.endswith('.yaml'):
                      continue
                  path = os.path.join(dp, f)
                  try:
                      with open(path, encoding='utf-8') as fh:
                          raw = fh.read()
                      data = yaml.safe_load(raw)

                      if not isinstance(data, dict):
                          errors.append(f'{path}: root must be a mapping')
                          continue

                      # Required fields
                      for field in REQUIRED_FIELDS:
                          if not data.get(field):
                              errors.append(f'{path}: missing required field \"{field}\"')

                      # Recommended fields
                      for field in RECOMMENDED_FIELDS:
                          if field not in data:
                              warnings.append(f'{path}: missing recommended field \"{field}\"')

                      # Action validation in do steps
                      do_steps = data.get('do', [])
                      if isinstance(do_steps, list):
                          for step in do_steps:
                              if isinstance(step, dict):
                                  for key in step:
                                      if key not in VALID_ACTIONS and key not in ('action', 'args'):
                                          warnings.append(f'{path}: unknown action \"{key}\"')

                      # Safety: check for dangerous expressions
                      for expr_field in ['when', 'until']:
                          expr_data = data.get(expr_field)
                          if isinstance(expr_data, dict):
                              for cond_list in expr_data.values():
                                  if isinstance(cond_list, list):
                                      for cond in cond_list:
                                          for pattern in DANGEROUS_PATTERNS:
                                              if re.search(pattern, str(cond)):
                                                  errors.append(f'{path}: dangerous expression in {expr_field}: {cond}')

                      # skill_id format
                      skill_id = data.get('skill_id', '')
                      if skill_id and not re.match(r'^[a-z0-9_]+$', skill_id):
                          warnings.append(f'{path}: skill_id \"{skill_id}\" should be lowercase alphanumeric+underscore')

                  except yaml.YAMLError as e:
                      errors.append(f'{path}: YAML parse error: {e}')
                  except Exception as e:
                      errors.append(f'{path}: {e}')

          if warnings:
              print('Warnings:')
              for w in warnings: print(f'  ⚠️  {w}')
              print()

          if errors:
              print('Errors:')
              for e in errors: print(f'  ❌ {e}')
              sys.exit(1)

          print(f'✅ All {len(fn)} Skill YAMLs valid')
          "

      - name: Validate marketplace index
        run: |
          python -c "
          import yaml, json, os, sys

          index_path = 'skills/marketplace/.index.json'
          if not os.path.exists(index_path):
              print('⚠️  No .index.json found, skipping')
              sys.exit(0)

          with open(index_path) as f:
              index = json.load(f)

          errors = []
          marketplace_dir = 'skills/marketplace'

          for skill_id, meta in index.get('skills', {}).items():
              path = os.path.join(marketplace_dir, meta.get('path', ''))
              if not os.path.exists(path):
                  errors.append(f'Index points to missing file: {path}')
                  continue

              with open(path, encoding='utf-8') as f:
                  data = yaml.safe_load(f)

              if data.get('skill_id') != skill_id:
                  errors.append(f'{path}: skill_id mismatch (index={skill_id}, file={data.get(\"skill_id\")})')

              if data.get('version') != meta.get('version'):
                  errors.append(f'{path}: version mismatch (index={meta.get(\"version\")}, file={data.get(\"version\")})')

          if errors:
              print('Index validation errors:')
              for e in errors: print(f'  ❌ {e}')
              sys.exit(1)

          print(f'✅ Index valid ({len(index.get(\"skills\", {}))} entries)')
          "

  sync-skills:
    name: 📦 Sync Skills
    runs-on: ubuntu-latest
    needs: [validate-skills]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List published skills
        run: |
          echo "=== Published Skills ==="
          find skills/ -name '*.yaml' | sort
          echo ""
          echo "Total: $(find skills/ -name '*.yaml' | wc -l)"
