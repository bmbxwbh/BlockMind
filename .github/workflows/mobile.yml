name: Build Mobile App

on:
  push:
    branches: [feature/mobile-app]
  pull_request:
    branches: [feature/mobile-app]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build apk --release --target-platform android-arm64
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: BlockMind-Mobile-Android-arm64
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: iOS IPA (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
        working-directory: mobile
      - run: flutter build ios --release --no-codesign
        working-directory: mobile
      - run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r BlockMind-Mobile-iOS-arm64.ipa Payload/
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: BlockMind-Mobile-iOS-arm64
          path: mobile/BlockMind-Mobile-iOS-arm64.ipa
          retention-days: 30

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - run: |
          echo "## Mobile Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android arm64 | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS arm64 | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
